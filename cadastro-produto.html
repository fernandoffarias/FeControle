<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produto - FêControle</title>

  <link rel="stylesheet" href="_css/paginaprincipal.css">
  <link rel="stylesheet" href="_css/produtos.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <img src="_imagens/pagina-principal/logomarca.png" class="logo-img">
      <span class="logo-text">FÊCONTROLE</span>
    </div>
  </div>
</header>

<main class="cadastro-page">

  <section class="cadastro-header">
    <div>
      <h1>Cadastro de Produto</h1>
      <p>Cadastre novos produtos para o estoque</p>
    </div>

    <a href="produtos.html" class="btn-primario">Voltar</a>
  </section>

  <section class="formulario-cadastro">
    <div class="campo">
      <label>Nome do produto</label>
      <input type="text">
    </div>

    <div class="campo">
      <label>Categoria</label>
      <input type="text">
    </div>

    <div class="campo">
      <label>Quantidade</label>
      <input type="number">
    </div>

    <div class="campo">
      <label>Preço</label>
      <input type="number">
    </div>

    <button class="btn-primario">Salvar produto</button>
  </section>

</main>

</body>
</html>
